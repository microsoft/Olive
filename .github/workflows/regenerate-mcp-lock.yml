name: "Regenerate MCP Lockfile"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install uv
      run: python -m pip install --index-url https://pypi.org/simple uv

    - name: Regenerate lockfile from PyPI
      run: |
        uv lock --directory mcp --python 3.12 --default-index https://pypi.org/simple --upgrade-package mcp
        uv lock --directory mcp --python 3.12 --default-index https://pypi.org/simple --check

    - name: Upload generated lockfile
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mcp-uv-lock
        path: mcp/uv.lock
        if-no-files-found: error
