name: "Regenerate MCP Lockfile"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install uv
      run: python -m pip install --index-url https://pypi.org/simple uv

    - name: Regenerate lockfile from PyPI
      run: |
        uv lock --directory mcp --python 3.12 --default-index https://pypi.org/simple --upgrade-package mcp
        uv lock --directory mcp --python 3.12 --default-index https://pypi.org/simple --check

    - name: Upload generated lockfile
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mcp-uv-lock
        path: mcp/uv.lock
        if-no-files-found: error
