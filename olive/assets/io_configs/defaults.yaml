# Default dimension values for dummy input generation
# These values are used when dimensions cannot be resolved from model config

# Attribute aliases (same concept, different naming across models)
aliases:
  # Layer count
  num_layers: [num_hidden_layers, n_layer, n_layers]
  # Hidden dimensions
  hidden_size: [dim, d_model, n_embd]
  num_attention_heads: [num_heads, n_head, n_heads, encoder_attention_heads]
  num_kv_heads: [num_key_value_heads]
  # MoE expert count. Covers flat configs (Mixtral / gpt-oss / PhiMoE
  # ``num_local_experts``, DeepSeek ``n_routed_experts``, Ernie4.5 / Aria
  # ``moe_num_experts``) and nested sub-configs (DBRX ``ffn_config``, Llama4 /
  # GLM4V-MoE / Qwen3-VL-MoE ``text_config``, Qwen3-Omni ``thinker_config.text_config``).
  num_experts:
    - num_local_experts
    - n_routed_experts
    - moe_num_experts
    - ffn_config.moe_num_experts
    - ffn_config.num_experts
    - text_config.num_experts
    - text_config.num_local_experts
    - text_config.n_routed_experts
    - text_config.moe_num_experts
    - thinker_config.text_config.num_experts
    - thinker_config.text_config.num_local_experts
  # Image dimensions
  height: [sample_size, image_size, vision_config.image_size]
  width: [sample_size, image_size, vision_config.image_size]
  num_channels: [in_channels, vision_config.num_channels]

# Common
batch_size: 2
sequence_length: 16
past_sequence_length: 16
num_choices: 4
vocab_size: 32000

# Image
width: 64
height: 64
num_channels: 3
point_batch_size: 3
nb_points_per_image: 2
visual_seq_length: 16

# Multimodal (CLIP, etc.)
text_batch_size: 2
image_batch_size: 2
projection_dim: 512
text_encoder_projection_dim: 1280

# Audio
feature_size: 80
nb_max_frames: 3000
audio_sequence_length: 16000
